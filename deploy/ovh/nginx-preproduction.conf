log_format beyond_minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
# Adapter les deux domaines, certificats et l'IP autorisée ; vérifier avec nginx -t.
server {
 listen 443 ssl;
 server_name formation-test.example.invalid;
 ssl_certificate /etc/letsencrypt/live/formation-test.example.invalid/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/formation-test.example.invalid/privkey.pem;
 allow 192.0.2.1;
 deny all;
 client_max_body_size 2m;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 access_log /var/log/nginx/beyond-access.log beyond_minimal;
 location / {
  proxy_pass http://127.0.0.1:3300;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 40s;
 }
}
server {
 listen 443 ssl;
 server_name laboratoire-test.example.invalid;
 ssl_certificate /etc/letsencrypt/live/laboratoire-test.example.invalid/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/laboratoire-test.example.invalid/privkey.pem;
 allow 192.0.2.1;
 deny all;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 location / {
  proxy_pass http://127.0.0.1:3301;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
